<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Apple Pay style success animation: a circle draws itself, then a tick, then a ring pulses out.">
  <title>Delivered tick</title>
  <style>
    .ring { stroke-dasharray: 214; animation: ring 3.2s ease-in-out infinite; }
    .tick { stroke-dasharray: 60; animation: tick 3.2s ease-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s linear infinite; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 3.2s ease-out infinite; }
    @keyframes ring { 0% { stroke-dashoffset: 214; } 35%, 100% { stroke-dashoffset: 0; } }
    @keyframes tick { 0%, 33% { stroke-dashoffset: 60; } 50%, 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 40% { opacity: 0; transform: scale(1); } 42% { opacity: .55; } 70%, 100% { opacity: 0; transform: scale(1.5); } }
    @keyframes pop { 0%, 40% { transform: scale(1); } 46% { transform: scale(1.08); } 56%, 100% { transform: scale(1); } }
  </style>
  <rect width="200" height="200" rx="28" fill="#000"/>
  <g class="pop">
    <circle class="pulse" cx="100" cy="100" r="38" fill="none" stroke="#06C167" stroke-width="3"/>
    <circle class="ring" cx="100" cy="100" r="34" fill="none" stroke="#06C167" stroke-width="5" stroke-linecap="round" transform="rotate(-90 100 100)"/>
    <path class="tick" d="M83 101 L95 113 L118 87" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
