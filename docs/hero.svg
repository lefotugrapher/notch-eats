<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Animated demo: the notch pill shows an Uber Eats order, expands into a card, drops down a large delivery PIN, then plays a delivered tick.">
  <title>Notch Eats demo</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cf0"/>
      <stop offset="0.55" stop-color="#8aa4ff"/>
      <stop offset="1" stop-color="#c7b6ff"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; fill: #fff; }
    .m { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .dim { fill: #ffffff; fill-opacity: .6; }
    .dimmer { fill: #ffffff; fill-opacity: .42; }
    .g { fill: #06C167; }
    #body { animation: grow 22s ease-in-out infinite; }
    #A { animation: sceneA 22s linear infinite; }
    #B { animation: sceneB 22s linear infinite; }
    #C { animation: sceneC 22s linear infinite; }
    #D { animation: sceneD 22s linear infinite; }
    #bandLive { animation: bandLive 22s linear infinite; }
    #bandDone { animation: sceneD 22s linear infinite; }
    #ring { stroke-dasharray: 214; animation: ring 22s linear infinite; }
    #tick { stroke-dasharray: 60; animation: tick 22s linear infinite; }
    #pulse { transform-box: fill-box; transform-origin: center; animation: pulse 22s linear infinite; }
    @keyframes grow {
      0%, 20% { height: 84px; } 24%, 92% { height: 250px; } 96%, 100% { height: 84px; }
    }
    @keyframes sceneA { 0%, 20% { opacity: 1; } 21%, 95% { opacity: 0; } 97%, 100% { opacity: 1; } }
    @keyframes bandLive { 0%, 20% { opacity: 0; } 22%, 70% { opacity: 1; } 71%, 100% { opacity: 0; } }
    @keyframes sceneB { 0%, 23% { opacity: 0; } 26%, 44% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes sceneC { 0%, 47% { opacity: 0; } 50%, 68% { opacity: 1; } 70%, 100% { opacity: 0; } }
    @keyframes sceneD { 0%, 71% { opacity: 0; } 73%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes ring { 0%, 73% { stroke-dashoffset: 214; } 78%, 100% { stroke-dashoffset: 0; } }
    @keyframes tick { 0%, 78% { stroke-dashoffset: 60; } 81%, 100% { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 80% { opacity: 0; transform: scale(1); } 81% { opacity: .55; transform: scale(1); } 87%, 100% { opacity: 0; transform: scale(1.5); } }
  </style>

  <rect width="760" height="330" rx="18" fill="url(#wall)"/>
  <rect width="760" height="24" fill="#000" fill-opacity=".18"/>
  <circle cx="18" cy="12" r="4" fill="#fff" fill-opacity=".7"/>
  <rect x="34" y="9" width="40" height="6" rx="3" fill="#fff" fill-opacity=".5"/>
  <rect x="84" y="9" width="30" height="6" rx="3" fill="#fff" fill-opacity=".5"/>
  <rect x="124" y="9" width="36" height="6" rx="3" fill="#fff" fill-opacity=".5"/>
  <rect x="660" y="9" width="24" height="6" rx="3" fill="#fff" fill-opacity=".5"/>
  <rect x="694" y="9" width="24" height="6" rx="3" fill="#fff" fill-opacity=".5"/>
  <rect x="728" y="9" width="18" height="6" rx="3" fill="#fff" fill-opacity=".5"/>

  <!-- the pill / card -->
  <!-- starts above the viewBox so only the bottom corners are visibly rounded; height animates to expand -->
  <rect id="body" x="150" y="-30" width="460" height="84" rx="20" fill="#000"/>

  <!-- scene A: collapsed pill -->
  <g id="A">
    <circle cx="176" cy="38" r="5" class="g"/>
    <text x="188" y="36" class="t" font-size="11" font-weight="600">Picking up</text>
    <text x="176" y="48" class="t dim" font-size="9">Alex · €14.61</text>
    <text x="592" y="43" class="t m" font-size="14" font-weight="700" text-anchor="end">14:58</text>
  </g>

  <!-- band while expanded -->
  <g id="bandLive">
    <circle cx="176" cy="38" r="5" class="g"/>
    <text x="188" y="36" class="t" font-size="11" font-weight="600">On the way</text>
    <text x="176" y="48" class="t dim" font-size="9">Alex · €14.61</text>
    <text x="592" y="43" class="t m" font-size="14" font-weight="700" text-anchor="end">9:59</text>
  </g>

  <!-- scene B: live card -->
  <g id="B">
    <rect x="172" y="66" width="130" height="104" rx="12" fill="#17231d"/>
    <polyline points="186,150 214,128 238,132 262,104 284,92" fill="none" stroke="#06C167" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="186" cy="150" r="5" fill="#ff9f0a" stroke="#fff" stroke-width="2"/>
    <circle cx="284" cy="92" r="5.5" fill="#0a84ff" stroke="#fff" stroke-width="2"/>
    <circle cx="238" cy="132" r="7" class="g" stroke="#fff" stroke-width="2.5"/>
    <text x="322" y="84" class="t" font-size="16" font-weight="650">Arrives 11:23 – 11:40 AM</text>
    <text x="322" y="104" class="t dim" font-size="12">Heading your way</text>
    <text x="322" y="122" class="t dim" font-size="12">Alex · bicycle · Top-rated</text>
    <text x="322" y="140" class="t dimmer" font-size="12">Example Mart · €14.61</text>
    <text x="322" y="170" class="t dimmer" font-size="11">PIN</text>
    <text x="350" y="172" class="t m g" font-size="26" font-weight="700" letter-spacing="4">2468</text>
    <g>
      <rect x="172" y="186" width="54" height="4" rx="2" class="g"/><rect x="230" y="186" width="54" height="4" rx="2" class="g"/>
      <rect x="288" y="186" width="54" height="4" rx="2" class="g"/><rect x="346" y="186" width="54" height="4" rx="2" class="g"/>
      <rect x="404" y="186" width="34" height="4" rx="2" fill="#fff" fill-opacity=".18"/>
    </g>
  </g>

  <!-- scene C: PIN drop-down, shown when the courier is about 10 s away -->
  <g id="C">
    <text x="380" y="82" class="t dim" font-size="13" font-weight="500" text-anchor="middle">Nearly there. Give your courier this PIN</text>
    <text x="386" y="152" class="t m g" font-size="78" font-weight="700" letter-spacing="14" text-anchor="middle">2468</text>
    <text x="380" y="180" class="t dimmer" font-size="12" text-anchor="middle">Alex · bicycle</text>
  </g>

  <!-- scene D: delivered -->
  <g id="bandDone">
    <circle cx="176" cy="38" r="5" class="g"/>
    <text x="188" y="42" class="t" font-size="11" font-weight="600">Delivered</text>
    <text x="592" y="43" class="t" font-size="15" font-weight="700" text-anchor="end">✓</text>
  </g>
  <g id="D">
    <circle id="pulse" cx="318" cy="128" r="36" fill="none" stroke="#06C167" stroke-width="3"/>
    <circle id="ring" cx="318" cy="128" r="34" fill="none" stroke="#06C167" stroke-width="5" stroke-linecap="round" transform="rotate(-90 318 128)"/>
    <path id="tick" d="M301 129 L313 141 L336 115" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="372" y="126" class="t" font-size="22" font-weight="650">Delivered</text>
    <text x="372" y="148" class="t dim" font-size="13">Enjoy your order</text>
  </g>

  <text x="380" y="318" class="t" fill-opacity=".85" font-size="11" text-anchor="middle" style="fill-opacity:.8">Illustration with made-up data · pill → live card → PIN at ~10 s away → delivered</text>
</svg>
